server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O shell da SPA deve ser sempre revalidado. Os assets gerados pelo Vite
    # continuam com cache imutável porque seus nomes incluem o hash do conteúdo.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Alguns navegadores consultam /favicon.ico mesmo quando a SPA declara outro URL.
    # Encaminhar essa rota elimina o favicon Vue estático e usa a última empresa do cookie.
    location = /favicon.ico {
        proxy_pass http://api:3001/api/branding/favicon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
    }

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
